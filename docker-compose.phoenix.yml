# ============================================================================
# Datalogue — Phoenix 独立观测编排
# ============================================================================
# 前置条件：先启动根 docker-compose.yml，确保业务 PostgreSQL 与共享网络已存在。
# 用法：docker compose -f docker-compose.phoenix.yml up -d
# ============================================================================

services:
  phoenix:
    # 部署环境按运维要求跟随 Phoenix 最新镜像；升级后必须重新执行观测链路验收。
    image: arizephoenix/phoenix:latest
    container_name: datalogue-phoenix
    environment:
      # 与 Datalogue 共用 PostgreSQL 和 datalogue 数据库，但 Phoenix 表固定落在 phoenix Schema。
      PHOENIX_SQL_DATABASE_URL: "postgresql://datalogue:${DB_PASSWORD:-datalogue}@db:5432/datalogue"
      PHOENIX_SQL_DATABASE_SCHEMA: "phoenix"
      PHOENIX_ENABLE_AUTH: "true"
      PHOENIX_SECRET: "${PHOENIX_SECRET:?请在 .env 设置高强度 PHOENIX_SECRET}"
      PHOENIX_ENABLE_STRONG_PASSWORD_POLICY: "true"
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: "${PHOENIX_ADMIN_INITIAL_PASSWORD:?请在 .env 设置 PHOENIX_ADMIN_INITIAL_PASSWORD}"
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: "14"
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_ALLOWED_PROVIDERS: "NONE"
    ports:
      # UI 与 OTLP 仅开放给部署机本地；远程访问 UI 必须通过 SSH 隧道。
      - "127.0.0.1:${PHOENIX_PORT:-8065}:6006"
      - "127.0.0.1:${PHOENIX_OTLP_PORT:-4317}:4317"
    restart: unless-stopped

networks:
  default:
    external: true
    name: "${DATALOGUE_NETWORK_NAME:-datalogue_default}"
