<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 740" font-family="-apple-system, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="460" y="38" text-anchor="middle" font-size="22" font-weight="600" fill="#0f172a">数语 · 语义治理新分层架构</text>
  <text x="460" y="60" text-anchor="middle" font-size="13" fill="#64748b">业务概念前置 · 实现细节后置 · 知识库作为输入上下文</text>

  <!-- 语义治理 bracket -->
  <path d="M 88 100 L 78 100 L 78 432 L 88 432" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="50" y="270" font-size="13" font-weight="600" fill="#2563eb" transform="rotate(-90 50 270)" text-anchor="middle">语 义 治 理</text>

  <!-- ===== 业务术语 (highlighted top) ===== -->
  <rect x="115" y="100" width="640" height="115" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="130" font-size="18" font-weight="600" fill="#1e3a8a">业务术语 · Business Terms</text>
  <rect x="595" y="113" width="148" height="22" rx="11" fill="#2563eb"/>
  <text x="669" y="129" text-anchor="middle" font-size="11" font-weight="500" fill="white">核心入口 · 主匹配目标</text>
  <text x="135" y="155" font-size="12" fill="#1f2937">composition → 指标 + 维度 + 过滤条件 + 时间窗</text>
  <text x="135" y="174" font-size="12" fill="#1f2937">查询模板 → 命名 SQL / 存储过程（如几千行报表 SP 的归处）</text>
  <text x="135" y="198" font-size="11" fill="#64748b">状态机：draft → abstract → implemented → deprecated</text>

  <!-- composition reference arrows down to 指标/维度 -->
  <path d="M 250 215 L 250 350" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow-down)"/>
  <path d="M 600 215 L 600 350" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow-down)"/>
  <text x="265" y="240" font-size="10" fill="#94a3b8" font-style="italic">composition 引用</text>
  <text x="615" y="240" font-size="10" fill="#94a3b8" font-style="italic">composition 引用</text>

  <!-- ===== 知识库 ===== -->
  <rect x="115" y="230" width="640" height="100" rx="10" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="135" y="257" font-size="16" font-weight="600" fill="#0f172a">知识库 · Knowledge Base</text>
  <text x="745" y="257" font-size="11" fill="#64748b" text-anchor="end">注入 Prompt 作为上下文</text>

  <rect x="135" y="270" width="290" height="50" rx="6" fill="white" stroke="#e2e8f0"/>
  <text x="150" y="289" font-size="12" font-weight="600" fill="#334155">静态知识</text>
  <text x="150" y="305" font-size="10.5" fill="#64748b">DDL · 字段注释 · 业务规则文档</text>

  <rect x="445" y="270" width="290" height="50" rx="6" fill="white" stroke="#e2e8f0"/>
  <text x="460" y="289" font-size="12" font-weight="600" fill="#334155">动态知识</text>
  <text x="460" y="305" font-size="10.5" fill="#64748b">历史 SQL 样例 · 失败修正记录（审核沉淀）</text>

  <!-- ===== 指标 + 维度 side by side ===== -->
  <rect x="115" y="345" width="310" height="85" rx="10" fill="#fafaf9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="135" y="372" font-size="15" font-weight="600" fill="#0f172a">指标 · Metrics</text>
  <text x="135" y="392" font-size="11.5" fill="#64748b">SQL 表达式 · 默认过滤 · 同义词</text>
  <text x="135" y="411" font-size="10.5" fill="#94a3b8" font-style="italic">被业务术语 composition 引用</text>

  <rect x="445" y="345" width="310" height="85" rx="10" fill="#fafaf9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="465" y="372" font-size="15" font-weight="600" fill="#0f172a">维度 · Dimensions</text>
  <text x="465" y="392" font-size="11.5" fill="#64748b">列映射 · 枚举值 · 同义词</text>
  <text x="465" y="411" font-size="10.5" fill="#94a3b8" font-style="italic">被业务术语 composition 引用</text>

  <!-- divider -->
  <line x1="115" y1="455" x2="755" y2="455" stroke="#e2e8f0" stroke-dasharray="5 4"/>
  <text x="435" y="450" font-size="10" fill="#94a3b8" text-anchor="middle">━━━ 语义层 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ 数据基础 ━━━</text>

  <!-- ===== 数据基础 ===== -->
  <path d="M 88 470 L 78 470 L 78 605 L 88 605" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="50" y="540" font-size="13" font-weight="600" fill="#64748b" transform="rotate(-90 50 540)" text-anchor="middle">数 据 基 础</text>

  <rect x="115" y="475" width="640" height="55" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="135" y="500" font-size="14.5" font-weight="600" fill="#334155">数据集 · Dataset</text>
  <text x="135" y="518" font-size="11" fill="#64748b">tables_json · 表关系 · 业务语义描述</text>

  <rect x="115" y="545" width="640" height="55" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="135" y="570" font-size="14.5" font-weight="600" fill="#334155">数据源 · Datasource</text>
  <text x="135" y="588" font-size="11" fill="#64748b">MySQL · Postgres · Oracle · Hive · 连接配置 + 元数据</text>

  <!-- right side: Agent 召回 arrow -->
  <line x1="790" y1="115" x2="790" y2="420" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="803" y="195" font-size="11.5" font-weight="600" fill="#2563eb">Agent 召回</text>
  <text x="803" y="211" font-size="11.5" font-weight="600" fill="#2563eb">优先级</text>
  <text x="803" y="232" font-size="10" fill="#475569">业务术语</text>
  <text x="803" y="245" font-size="10" fill="#475569">↓ 命中即展开</text>
  <text x="803" y="265" font-size="10" fill="#475569">指标/维度</text>
  <text x="803" y="278" font-size="10" fill="#475569">兜底直接召回</text>
  <text x="803" y="298" font-size="10" fill="#475569">知识库注入</text>
  <text x="803" y="311" font-size="10" fill="#475569">Prompt 上下文</text>

  <!-- right side: 创建依赖 arrow -->
  <line x1="880" y1="600" x2="880" y2="100" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-down)"/>
  <text x="894" y="360" font-size="11" font-weight="500" fill="#64748b" transform="rotate(-90 894 360)" text-anchor="middle">创建依赖（自底向上）</text>

  <!-- ===== UI 导航顺序提示框 ===== -->
  <rect x="115" y="630" width="640" height="90" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="135" y="654" font-size="13" font-weight="600" fill="#78350f">⚐ UI 导航顺序（语义治理 Tab 排序）</text>
  <text x="135" y="678" font-size="13" fill="#92400e" font-weight="500">业务术语  ➜  知识库  ➜  指标  ➜  维度</text>
  <text x="135" y="700" font-size="11" fill="#a16207">业务概念优先曝光,指标/维度作为术语详情页的"实现细节"下钻入口</text>

  <!-- footer note -->
  <text x="460" y="732" text-anchor="middle" font-size="10.5" fill="#94a3b8" font-style="italic">展示层级 ≠ 依赖层级 · schema 依赖方向仍为底层向上,UI 优先级方向相反</text>
</svg>
