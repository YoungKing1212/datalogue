# Datalogue Nginx 站点配置
# 上游：
#   - web:3000    静态资源（`serve -s dist`）
#   - api:8000    后端 API；AgentScope 原始服务仅供容器内调用
#
# 端口：
#   - 80  → 强制跳转 https（保留 /healthz 明文供 docker healthcheck）
#   - 443 → 主服务入口，启用 Web Crypto 需要的"安全上下文"

upstream datalogue_web {
    server web:3000;
    keepalive 16;
}

upstream datalogue_api {
    server api:8000;
    keepalive 32;
}

# ── HTTP: 只放 /healthz，其余强制跳 https ─────────────
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: 主入口 ─────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/datalogue.crt;
    ssl_certificate_key /etc/nginx/certs/datalogue.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 反代下游超时
    proxy_connect_timeout 5s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml application/xml+rss
               text/javascript image/svg+xml;

    # nginx 自身健康检查
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ── 后端 API ─────────────────────────────────────
    location /api/ {
        proxy_pass http://datalogue_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 流式响应
        proxy_buffering off;
        proxy_cache off;
    }

    # ── AgentScope 原始服务禁止公网直通 ───────────────
    location /agentscope/ {
        return 404;
    }

    # ── 前端静态资源 ─────────────────────────────────
    location / {
        proxy_pass http://datalogue_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
