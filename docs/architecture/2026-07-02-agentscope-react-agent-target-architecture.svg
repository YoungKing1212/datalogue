<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160">
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#15803d"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#c2410c"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 36px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .box-title { font: 700 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .box-subtitle { font: 600 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .text { font: 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .tiny { font: 12px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .tag { font: 700 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .blue-box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.2; }
      .green-box { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2.2; }
      .orange-box { fill: #fff7ed; stroke: #f97316; stroke-width: 2.2; }
      .purple-box { fill: #faf5ff; stroke: #7c3aed; stroke-width: 2.2; }
      .slate-box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.8; }
      .red-box { fill: #fef2f2; stroke: #dc2626; stroke-width: 2.2; }
      .yellow-box { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
      .inner { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .dash { stroke-dasharray: 8 7; }
      .blue-line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .green-line { stroke: #15803d; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .orange-line { stroke: #c2410c; stroke-width: 3; fill: none; marker-end: url(#arrowOrange); }
      .gray-line { stroke: #475569; stroke-width: 2.4; fill: none; marker-end: url(#arrowGray); }
      .thin-gray { stroke: #94a3b8; stroke-width: 1.8; fill: none; marker-end: url(#arrowGray); }
      .no-arrow { stroke: #94a3b8; stroke-width: 1.8; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1160" fill="#ffffff"/>

  <text x="900" y="52" text-anchor="middle" class="title">Datalogue AgentScope 2.0 ReAct Agent 目标架构</text>
  <text x="900" y="84" text-anchor="middle" class="subtitle">纠偏后的目标：AgenticLeadAgent 与 BI Agent 都是 AgentScope 2.0 ReAct Agent；Dataset 查询链路作为 BI Agent 的 Skill / Toolkit / Toolchain</text>

  <rect x="40" y="125" width="235" height="365" rx="10" class="blue-box"/>
  <text x="157" y="160" text-anchor="middle" class="box-title">1. 用户入口</text>
  <text x="157" y="190" text-anchor="middle" class="box-subtitle">Chat / Workbench</text>
  <rect x="70" y="225" width="175" height="60" rx="8" class="inner"/>
  <text x="157" y="253" text-anchor="middle" class="text">自然语言问题</text>
  <text x="157" y="274" text-anchor="middle" class="small">dataset_id / refs</text>
  <rect x="70" y="310" width="175" height="92" rx="8" class="inner"/>
  <text x="157" y="338" text-anchor="middle" class="text">只展示安全输出</text>
  <text x="157" y="364" text-anchor="middle" class="small">summary</text>
  <text x="157" y="386" text-anchor="middle" class="small">artifact_ref / checkpoint_ref</text>
  <rect x="70" y="425" width="175" height="42" rx="8" class="inner"/>
  <text x="157" y="451" text-anchor="middle" class="small">不展示 SQL / raw rows</text>

  <rect x="330" y="125" width="300" height="365" rx="10" class="slate-box"/>
  <text x="480" y="158" text-anchor="middle" class="box-title">2. Datalogue Runtime</text>
  <text x="480" y="188" text-anchor="middle" class="box-subtitle">统一任务入口与真相源</text>
  <rect x="360" y="220" width="240" height="54" rx="8" class="inner"/>
  <text x="480" y="252" text-anchor="middle" class="text">/api/agentic-shell/tasks/stream</text>
  <rect x="360" y="292" width="240" height="54" rx="8" class="inner"/>
  <text x="480" y="324" text-anchor="middle" class="text">AgenticShellTask / Event</text>
  <rect x="360" y="364" width="240" height="54" rx="8" class="inner"/>
  <text x="480" y="396" text-anchor="middle" class="text">Session / Message / Refs</text>
  <rect x="360" y="437" width="240" height="32" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="480" y="458" text-anchor="middle" class="small">运行时不做业务推理，只编排生命周期</text>

  <rect x="690" y="125" width="360" height="365" rx="10" class="orange-box"/>
  <text x="870" y="158" text-anchor="middle" class="box-title">3. AgenticLeadAgent</text>
  <text x="870" y="188" text-anchor="middle" class="box-subtitle">AgentScope 2.0 ReAct Agent</text>
  <rect x="720" y="220" width="300" height="48" rx="8" class="inner"/>
  <text x="870" y="250" text-anchor="middle" class="text">任务分类：BI / Report / Python / Audit</text>
  <rect x="720" y="285" width="300" height="48" rx="8" class="inner"/>
  <text x="870" y="315" text-anchor="middle" class="text">选择子 Agent：BI Agent 优先启用</text>
  <rect x="720" y="350" width="300" height="48" rx="8" class="inner"/>
  <text x="870" y="380" text-anchor="middle" class="text">工具白名单 / Policy / Guard</text>
  <rect x="720" y="415" width="300" height="48" rx="8" class="inner"/>
  <text x="870" y="445" text-anchor="middle" class="text">上下文投影与输出清洗</text>

  <rect x="1110" y="125" width="385" height="365" rx="10" class="green-box"/>
  <text x="1302" y="158" text-anchor="middle" class="box-title">4. BI Agent</text>
  <text x="1302" y="188" text-anchor="middle" class="box-subtitle">AgentScope 2.0 ReAct Agent</text>
  <rect x="1140" y="220" width="325" height="48" rx="8" class="inner"/>
  <text x="1302" y="250" text-anchor="middle" class="text">理解问数目标与数据集上下文</text>
  <rect x="1140" y="285" width="325" height="48" rx="8" class="inner"/>
  <text x="1302" y="315" text-anchor="middle" class="text">选择 Dataset Query Skill / Toolkit</text>
  <rect x="1140" y="350" width="325" height="48" rx="8" class="inner"/>
  <text x="1302" y="380" text-anchor="middle" class="text">管理 run / confirmation / handoff</text>
  <rect x="1140" y="415" width="325" height="48" rx="8" class="inner"/>
  <text x="1302" y="445" text-anchor="middle" class="text">返回业务摘要与 artifact 引用</text>

  <rect x="1540" y="125" width="220" height="365" rx="10" class="purple-box"/>
  <text x="1650" y="158" text-anchor="middle" class="box-title">5. 可选子 Agent</text>
  <text x="1650" y="188" text-anchor="middle" class="box-subtitle">后续显式启用</text>
  <rect x="1570" y="225" width="160" height="48" rx="8" class="inner"/>
  <text x="1650" y="255" text-anchor="middle" class="text">ReportAgent</text>
  <rect x="1570" y="295" width="160" height="48" rx="8" class="inner"/>
  <text x="1650" y="325" text-anchor="middle" class="text">PythonAgent</text>
  <rect x="1570" y="365" width="160" height="48" rx="8" class="inner"/>
  <text x="1650" y="395" text-anchor="middle" class="text">AuditAgent</text>
  <text x="1650" y="450" text-anchor="middle" class="small">默认 disabled</text>

  <path d="M275 305 C300 305 305 305 330 305" class="blue-line"/>
  <path d="M630 305 C660 305 660 305 690 305" class="gray-line"/>
  <path d="M1050 305 C1080 305 1080 305 1110 305" class="orange-line"/>
  <path d="M1050 430 C1250 540 1470 440 1540 305" class="thin-gray dash"/>

  <rect x="330" y="548" width="1430" height="445" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1045" y="585" text-anchor="middle" class="box-title">BI Agent 内部受控问数链路</text>
  <text x="1045" y="612" text-anchor="middle" class="subtitle">SQL 可以在 BI Agent 控制面与 Toolchain 内部存在，但默认不进入 AgenticLeadAgent 上下文和用户可见输出</text>

  <rect x="370" y="650" width="260" height="270" rx="10" class="green-box"/>
  <text x="500" y="684" text-anchor="middle" class="box-title">Dataset Query Skill</text>
  <text x="500" y="712" text-anchor="middle" class="box-subtitle">注册进 BI Agent</text>
  <rect x="400" y="745" width="200" height="46" rx="8" class="inner"/>
  <text x="500" y="774" text-anchor="middle" class="text">capability_manifest</text>
  <rect x="400" y="807" width="200" height="46" rx="8" class="inner"/>
  <text x="500" y="836" text-anchor="middle" class="text">build_runtime_bridge</text>
  <rect x="400" y="869" width="200" height="28" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="500" y="888" text-anchor="middle" class="small">Skill 只注册能力，不直接泄露执行态</text>

  <rect x="700" y="650" width="320" height="270" rx="10" class="purple-box"/>
  <text x="860" y="684" text-anchor="middle" class="box-title">BI Toolkit</text>
  <text x="860" y="712" text-anchor="middle" class="box-subtitle">AgentScope Tools</text>
  <rect x="730" y="742" width="122" height="38" rx="8" class="inner"/>
  <text x="791" y="766" text-anchor="middle" class="small">get_status</text>
  <rect x="868" y="742" width="122" height="38" rx="8" class="inner"/>
  <text x="929" y="766" text-anchor="middle" class="small">list_assets</text>
  <rect x="730" y="796" width="122" height="38" rx="8" class="inner"/>
  <text x="791" y="820" text-anchor="middle" class="small">compile_dsl</text>
  <rect x="868" y="796" width="122" height="38" rx="8" class="inner"/>
  <text x="929" y="820" text-anchor="middle" class="small">execute_query</text>
  <rect x="730" y="850" width="122" height="38" rx="8" class="inner"/>
  <text x="791" y="874" text-anchor="middle" class="small">repair_dsl</text>
  <rect x="868" y="850" width="122" height="38" rx="8" class="inner"/>
  <text x="929" y="874" text-anchor="middle" class="small">create_artifact</text>

  <rect x="1090" y="650" width="335" height="270" rx="10" class="orange-box"/>
  <text x="1257" y="684" text-anchor="middle" class="box-title">Dataset Toolchain</text>
  <text x="1257" y="712" text-anchor="middle" class="box-subtitle">确定性执行状态机</text>
  <text x="1125" y="754" class="text">1. 读取安全 catalog / manifest</text>
  <text x="1125" y="789" class="text">2. 生成 DSL，不直接生成裸 SQL</text>
  <text x="1125" y="824" class="text">3. 编译为 SQL，写入 control plane</text>
  <text x="1125" y="859" class="text">4. 执行只读查询，产出 artifact</text>
  <text x="1125" y="894" class="text">5. 返回 summary / refs / row count</text>

  <rect x="1500" y="650" width="220" height="270" rx="10" class="slate-box"/>
  <text x="1610" y="684" text-anchor="middle" class="box-title">Datalogue 真相源</text>
  <text x="1610" y="712" text-anchor="middle" class="box-subtitle">数据库与产物存储</text>
  <rect x="1530" y="746" width="160" height="42" rx="8" class="inner"/>
  <text x="1610" y="773" text-anchor="middle" class="text">Run / Handoff</text>
  <rect x="1530" y="808" width="160" height="42" rx="8" class="inner"/>
  <text x="1610" y="835" text-anchor="middle" class="text">ArtifactStore</text>
  <rect x="1530" y="870" width="160" height="42" rx="8" class="inner"/>
  <text x="1610" y="897" text-anchor="middle" class="text">Checkpoint / Refs</text>

  <path d="M1302 490 C1302 570 500 575 500 650" class="green-line"/>
  <path d="M630 785 C665 785 665 785 700 785" class="green-line"/>
  <path d="M1020 785 C1055 785 1055 785 1090 785" class="orange-line"/>
  <path d="M1425 785 C1460 785 1460 785 1500 785" class="gray-line"/>

  <rect x="40" y="548" width="235" height="445" rx="10" class="yellow-box"/>
  <text x="157" y="584" text-anchor="middle" class="box-title">横切能力</text>
  <rect x="70" y="630" width="175" height="58" rx="8" class="inner"/>
  <text x="157" y="656" text-anchor="middle" class="text">Middleware</text>
  <text x="157" y="677" text-anchor="middle" class="small">Tracing / logging / guard</text>
  <rect x="70" y="715" width="175" height="78" rx="8" class="inner"/>
  <text x="157" y="741" text-anchor="middle" class="text">调试日志</text>
  <text x="157" y="764" text-anchor="middle" class="small">AGENT_DEBUG_RAW_LOGS</text>
  <text x="157" y="785" text-anchor="middle" class="small">true 时打印 raw payload</text>
  <rect x="70" y="820" width="175" height="98" rx="8" class="inner"/>
  <text x="157" y="846" text-anchor="middle" class="text">安全边界</text>
  <text x="157" y="869" text-anchor="middle" class="small">普通日志脱敏</text>
  <text x="157" y="890" text-anchor="middle" class="small">用户输出只给 refs</text>
  <text x="157" y="911" text-anchor="middle" class="small">SQL 留在控制面</text>

  <path d="M275 660 C310 660 310 660 330 660" class="thin-gray"/>
  <path d="M275 760 C310 760 310 760 330 760" class="thin-gray"/>
  <path d="M275 870 C310 870 310 870 330 870" class="thin-gray"/>

  <rect x="690" y="1025" width="805" height="78" rx="10" class="red-box"/>
  <text x="1092" y="1056" text-anchor="middle" class="box-title">当前代码缺口</text>
  <text x="1092" y="1084" text-anchor="middle" class="text">当前只有 DatasetAgent 是 AgentScope Agent；下一步必须把 AgenticLeadAgent 与 BI Agent SDK 化为 AgentScope 2.0 ReAct Agent</text>

  <rect x="40" y="1025" width="560" height="78" rx="10" class="slate-box"/>
  <text x="320" y="1056" text-anchor="middle" class="box-title">落地顺序建议</text>
  <text x="320" y="1084" text-anchor="middle" class="text">先 AgenticLeadAgent SDK 化，再 BI Agent SDK 化，最后删除 façade 直连 handoff 的过渡路径</text>

  <text x="1718" y="1130" text-anchor="end" class="tiny">Datalogue architecture target, generated 2026-07-02</text>
</svg>
