# ============================================================================
# Datalogue — 一体化部署编排
# ============================================================================
# 用法：
#   docker compose up -d              # 完整启动 (db + redis + api + web)
#   docker compose up -d db redis     # 仅启动基础设施（本地开发）
#
# 敏感变量通过 .env 或环境变量注入。示例见 datalogue-api/.env.example
# ============================================================================

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: datalogue-db
    environment:
      POSTGRES_USER: datalogue
      POSTGRES_PASSWORD: ${DB_PASSWORD:-datalogue}
      POSTGRES_DB: datalogue
    ports:
      - "5432:5432"
    volumes:
      - datalogue_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datalogue -d datalogue"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: datalogue-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - datalogue_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  phoenix:
    # 固定到已验证的 Phoenix 18.0.0 manifest digest，禁止跟随 latest 漂移。
    image: arizephoenix/phoenix:version-18.0.0@sha256:949b445c8ce45b2bb98da42e7ec46dc2afc272c09edd69f9d063e343f5ec703c
    container_name: datalogue-phoenix
    environment:
      # 与 Datalogue 共用 PostgreSQL 和 datalogue 数据库，但 Phoenix 的所有表固定落在 phoenix Schema。
      PHOENIX_SQL_DATABASE_URL: "postgresql://datalogue:${DB_PASSWORD:-datalogue}@db:5432/datalogue"
      PHOENIX_SQL_DATABASE_SCHEMA: "phoenix"
      # Phoenix 仅供内部开发使用：启用本地账号认证、首位管理员强密码与 14 天留存。
      PHOENIX_ENABLE_AUTH: "true"
      PHOENIX_SECRET: "${PHOENIX_SECRET:?请在 .env 设置高强度 PHOENIX_SECRET}"
      PHOENIX_ENABLE_STRONG_PASSWORD_POLICY: "true"
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: "${PHOENIX_ADMIN_INITIAL_PASSWORD:?请在 .env 设置 PHOENIX_ADMIN_INITIAL_PASSWORD}"
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: "14"
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_ALLOWED_PROVIDERS: "NONE"
    ports:
      # 只允许宿主机经 SSH 隧道访问 UI；OTLP gRPC 仅在 Docker 内网通过 expose 提供。
      - "6006:6006"
      - "4317:4317"
    # expose:
    #   - "4317"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./datalogue-api
      dockerfile: Dockerfile
    image: datalogue-api:latest
    container_name: datalogue-api
    env_file:
      - path: ./datalogue-api/.env
        required: false
    environment:
      # 数据库（密码经 ${DB_PASSWORD} 注入）
      DATABASE_URL: "postgresql://datalogue:${DB_PASSWORD:-datalogue}@db:5432/datalogue"
      # LLM 凭证由前端设置页写入数据库，容器不注入 OPENAI_API_KEY / OPENAI_BASE_URL / LLM_MODEL
      # AgentScope 基础设施
      AGENTSCOPE_SERVICE_ENABLED: "true"
      AGENTSCOPE_MOUNT_PATH: "/agentscope"
      AGENTSCOPE_SERVICE_BASE_URL: "http://api:8000/agentscope"
      AGENTSCOPE_REDIS_HOST: redis
      AGENTSCOPE_REDIS_PORT: "6379"
      AGENTSCOPE_REDIS_DB: "0"
      AGENTSCOPE_REDIS_PASSWORD: ""
      AGENTSCOPE_REDIS_URL: "redis://redis:6379/0"
      AGENTSCOPE_WORKSPACE_BASEDIR: "/app/data/agentscope/workspaces"
      AGENTSCOPE_WORKSPACE_TTL_SECONDS: "3600"
      # 安全（生产必须覆盖默认值）
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
      AES_KEY: "${AES_KEY:-your-32-byte-aes-key-here!!}"
      # 运行环境
      APP_ENV: "${APP_ENV:-production}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # Phoenix 的初始化分两步：先启动 Phoenix 创建 system key，再把以下开关与 key 写入部署机密并重启 API。
      # exporter 不作为 API 依赖；Phoenix 停机时问数与健康检查仍保持可用。
      AGENTSCOPE_OTEL_TRACING_ENABLED: "${AGENTSCOPE_OTEL_TRACING_ENABLED:-false}"
      AGENTSCOPE_OTEL_LOGGING_ENABLED: "false"
      AGENTSCOPE_OTEL_EXPORTER_ENABLED: "${AGENTSCOPE_OTEL_EXPORTER_ENABLED:-false}"
      AGENTSCOPE_OTEL_EXPORTER_ENDPOINT: "phoenix:4317"
      AGENTSCOPE_OTEL_EXPORTER_INSECURE: "true"
      AGENTSCOPE_OTEL_EXPORTER_AUTH_TOKEN: "${PHOENIX_SYSTEM_API_KEY:-}"
      AGENTSCOPE_OTEL_EXPORTER_PROJECT_NAME: "${PHOENIX_PROJECT_NAME:-datalogue-production}"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - datalogue_workspaces:/app/data/agentscope/workspaces
      - datalogue_api_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 探针路径挂在 app/main.py:/health（避免依赖 curl）
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./datalogue-web
      dockerfile: Dockerfile
    image: datalogue-web:latest
    container_name: datalogue-web
    # 纯静态服务，不对外暴露端口；仅在 docker 网络里被 nginx 消费
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: ./datalogue-nginx
      dockerfile: Dockerfile
    image: datalogue-nginx:latest
    container_name: datalogue-nginx
    # 唯一对外入口（HTTPS，Web Crypto 需要安全上下文）
    # 容器内 80 端口仅供 docker healthcheck 使用，不对外暴露
    ports:
      - "${WEB_PORT:-3000}:443"
    environment:
      # 自签证书 SAN 列表；局域网访问请追加机器 IP，如
      #   NGINX_TLS_HOSTS=localhost,127.0.0.1,192.168.1.10
      NGINX_TLS_HOSTS: "${NGINX_TLS_HOSTS:-localhost,127.0.0.1}"
      NGINX_TLS_DAYS: "${NGINX_TLS_DAYS:-3650}"
    volumes:
      # 证书持久化，避免每次重启重新签发（浏览器多一次"不受信任"确认）
      - datalogue_nginx_certs:/etc/nginx/certs
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  datalogue_pgdata:
  datalogue_redisdata:
  datalogue_workspaces:
  datalogue_api_logs:
  datalogue_nginx_certs:
