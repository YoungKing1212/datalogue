# ============================================================================
# Datalogue API — 后端部署片段
# ============================================================================
# 本文件由仓库根 docker-compose.yml 通过 include 聚合，不单独定义 PostgreSQL。
# migration 与后端镜像、Alembic 脚本版本绑定，成功退出后根 Compose 才启动 API。
# ============================================================================

services:
  migration:
    build:
      context: .
      dockerfile: Dockerfile
    image: datalogue-api:latest
    container_name: datalogue-migration
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: "postgresql://datalogue:${DB_PASSWORD:-datalogue}@db:5432/datalogue"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    # 迁移是部署闸门：成功后退出 0，失败则阻止 API 启动，不作为常驻服务重启。
    restart: "no"
