# ============================================================================
# datalogue-api 本地开发用 compose — 仅启动基础设施 (db + redis)
# ============================================================================
# 用途：
#   `make docker-up-infra` 会调用本文件启动 pg + redis，供 `make dev` 在宿主机
#   跑 uvicorn 时使用。
#
# 完整部署（含 api + web）请使用仓库根目录的 ../docker-compose.yml：
#   cd .. && docker compose up -d
# ============================================================================

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: datalogue-db
    environment:
      POSTGRES_USER: datalogue
      POSTGRES_PASSWORD: ${DB_PASSWORD:-datalogue}
      POSTGRES_DB: datalogue
    ports:
      - "5432:5432"
    volumes:
      - datalogue_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datalogue -d datalogue"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: datalogue-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - datalogue_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  datalogue_pgdata:
  datalogue_redisdata:
