services:
  # ── 基础设施 ──────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: datalogue-db
    environment:
      POSTGRES_USER: datalogue
      POSTGRES_PASSWORD: ${DB_PASSWORD:-datalogue}
      POSTGRES_DB: datalogue
    ports:
      - "5432:5432"
    volumes:
      - datalogue_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datalogue -d datalogue"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: datalogue-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - datalogue_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── API 服务（需要 --profile all 才会启动）───────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: datalogue-api:latest
    container_name: datalogue-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # 数据库（password 由 ${DB_PASSWORD} 注入，通过 .env 或环境变量设置）
      DATABASE_URL: "postgresql://datalogue:${DB_PASSWORD:-datalogue}@db:5432/datalogue"
      # LLM（必须配置）
      OPENAI_API_KEY: "${OPENAI_API_KEY:?请设置 OPENAI_API_KEY 环境变量}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.minimaxi.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-MiniMax-M2.7}"
      # AgentScope 基础设施
      AGENTSCOPE_SERVICE_ENABLED: "true"
      AGENTSCOPE_MOUNT_PATH: "/agentscope"
      AGENTSCOPE_SERVICE_BASE_URL: "http://localhost:8000/agentscope"
      AGENTSCOPE_REDIS_HOST: redis
      AGENTSCOPE_REDIS_PORT: "6379"
      AGENTSCOPE_REDIS_DB: "0"
      AGENTSCOPE_REDIS_URL: "redis://redis:6379/0"
      AGENTSCOPE_WORKSPACE_BASEDIR: "/app/data/agentscope/workspaces"
      AGENTSCOPE_WORKSPACE_TTL_SECONDS: "3600"
      # 安全
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
      AES_KEY: "${AES_KEY:-your-32-byte-aes-key-here!!}"
      # 运行环境
      APP_ENV: "${APP_ENV:-production}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - datalogue_workspaces:/app/data/agentscope/workspaces
      # 企业数据源驱动（可选）：挂载 wheel 包目录
      # - ./wheelhouse:/app/wheelhouse
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 默认配置只启动 api；基础设施通过 --profile all 启动
    profiles:
      - all

volumes:
  datalogue_pgdata:
  datalogue_redisdata:
  datalogue_workspaces:
