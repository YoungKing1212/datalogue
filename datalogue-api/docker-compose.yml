services:
  db:
    image: pgvector/pgvector:pg16
    container_name: datalogue-db
    environment:
      POSTGRES_USER: datalogue
      POSTGRES_PASSWORD: datalogue
      POSTGRES_DB: datalogue
    ports:
      - "5432:5432"
    volumes:
      - datalogue_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datalogue -d datalogue"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: datalogue-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - datalogue_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  datalogue_pgdata:
  datalogue_redisdata:
