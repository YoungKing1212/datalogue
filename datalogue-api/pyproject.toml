[project]
name = "datalogue-api"
version = "0.1.0"
description = "数语 AI 原生智能问数平台后端 API"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]>=0.31.1,<0.32",
    "sse-starlette==2.1.0",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    "pymysql==1.2.0",
    "pgvector==0.2.5",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.6,<3",
    "agentscope[service,storage]==2.0.3",
    "mcp>=1.28.1,<2",
    "langchain==0.2.0",
    "langchain-openai==0.1.7",
    "langgraph==0.0.65",
    "cryptography==42.0.7",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-dotenv==1.0.1",
    "httpx>=0.27.1,<0.28",
    "orjson==3.10.3",
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "sqlglot==30.9.0",
]

[project.optional-dependencies]
dev = [
    "black==24.4.2",
    "ruff==0.4.8",
    "mypy==1.10.0",
]
enterprise = [
    "oracledb==2.5.1",
    "PyHive[hive_pure_sasl,presto]==0.7.0",
    "trino==0.333.0",
    "pyodbc==5.2.0",
    "clickhouse-sqlalchemy==0.3.2",
    "clickhouse-driver==0.2.9",
    "sqlalchemy-bigquery==1.12.1",
    "google-cloud-bigquery-storage==2.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: 需要真实外部服务或真实 LLM 的集成测试",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
